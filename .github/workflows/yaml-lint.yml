name: YAML lint

on:
  push:
    branches: [main]
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/actions.lock"

permissions:
  contents: read

jobs:
  yamllint:
    name: 🧹 yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out configuration from GitHub
        uses: actions/checkout@v6.0.3
      - name: 🚀 Run yamllint
        run: yamllint --strict .
