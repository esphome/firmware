name: Build

on:
  pull_request:
    paths:
      - "esp-web-tools/**"
      - "esphome-web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

# The called workflow's draft-release jobs (read draft info, replace assets,
# strip the pending warning) need contents: write; they only run on
# workflow_run events. Fork pull requests still get a read-only token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build to Draft Release
    # Builds both firmware groups and, when triggered by a successful Release
    # Drafter run, uploads them to the current draft release. On
    # pull_request/workflow_dispatch it only builds. Both groups are built in
    # one call so the draft's pending warning is only removed once everything
    # is built.
    uses: esphome/workflows/.github/workflows/build-to-draft-release.yml@2026.11.2
    with:
      esphome-version: 2026.11.0
      groups: |
        [
          {
            "name": "esp-web-tools",
            "files": [
              "esp-web-tools/esp32.yaml",
              "esp-web-tools/esp32c3.yaml",
              "esp-web-tools/esp32c6.yaml",
              "esp-web-tools/esp32s2.yaml",
              "esp-web-tools/esp32s3.yaml",
              "esp-web-tools/esp8266.yaml"
            ]
          },
          {
            "name": "esphome-web",
            "files": [
              "esphome-web/esp32.factory.yaml",
              "esphome-web/esp32c2.factory.yaml",
              "esphome-web/esp32c3.factory.yaml",
              "esphome-web/esp32c5.factory.yaml",
              "esphome-web/esp32c6.factory.yaml",
              "esphome-web/esp32c61.factory.yaml",
              "esphome-web/esp32s2.factory.yaml",
              "esphome-web/esp32s3.factory.yaml",
              "esphome-web/esp32s31.factory.yaml",
              "esphome-web/esp8266.factory.yaml",
              "esphome-web/pico-w.factory.yaml",
              "esphome-web/pico-2-w.factory.yaml",
              "esphome-web/bk7231n.factory.yaml",
              "esphome-web/bk7231t.factory.yaml",
              "esphome-web/bk7238.factory.yaml",
              "esphome-web/bk7252.factory.yaml",
              "esphome-web/ln882h.factory.yaml",
              "esphome-web/rtl8710b.factory.yaml",
              "esphome-web/rtl8720c.factory.yaml"
            ]
          }
        ]
